<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - CodeMaster Quiz</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, pink, pink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #4caf50;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4caf50;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form onsubmit="registerUser(); return false;">
      <input type="text" id="regName" placeholder="Enter your name" required />
      <input type="text" id="regUsername" placeholder="Username" required />
      <input type="password" id="regPassword" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <p style="text-align:center;">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    function registerUser() {
      const name = document.getElementById('regName').value;
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;

      if (username && password) {
        const userData = { name, username, password };
        localStorage.setItem(`user_${username}`, JSON.stringify(userData));
        alert('Registration successful!');
        window.location.href = 'login.html';
      }
    }
  </script>
</body>
</html>

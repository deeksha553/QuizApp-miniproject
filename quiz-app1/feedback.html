<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback - CodeMaster Quiz</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, pink, pink);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 90%;
    }
    h2 {
      text-align: center;
      color: #4caf50;
    }
    textarea, input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #4caf50;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>We Value Your Feedback</h2>
    <input type="text" id="feedbackName" placeholder="Your Name">
    <textarea id="feedbackText" rows="5" placeholder="Your feedback..."></textarea>
    <button onclick="submitFeedback()">Submit</button>
  </div>

  <script>
    function submitFeedback() {
      const name = document.getElementById('feedbackName').value.trim();
      const feedback = document.getElementById('feedbackText').value.trim();

      if (!feedback) {
        alert("Please enter your feedback.");
        return;
      }

      const entry = { name, feedback, timestamp: new Date().toISOString() };
      let allFeedback = JSON.parse(localStorage.getItem("quizFeedback")) || [];
      allFeedback.push(entry);
      localStorage.setItem("quizFeedback", JSON.stringify(allFeedback));

      alert("Thank you for your feedback!");
      document.getElementById('feedbackName').value = '';
      document.getElementById('feedbackText').value = '';
    }
  </script>
</body>
</html>
